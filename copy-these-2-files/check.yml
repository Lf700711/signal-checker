name: Run signal check

# 手動執行：到 Actions 頁面 → Run signal check → Run workflow。
# 沒有自動排程；你想檢查時（美股開盤後，紐約時間 9:35 左右）自己按一下。
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "只寄一封測試信，確認 Email 設定（不檢查行情）"
        type: boolean
        default: false

permissions:
  contents: write

# 檢查與回報部位共用同一把鎖，避免同時改檔案
concurrency:
  group: signal-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          # 手動執行不受時間窗與「今天已執行」限制，每次按都會用當下行情重新檢查
          ARGS="--force"
          if [ "$TEST_EMAIL" = "true" ]; then ARGS="--test-email"; fi
          python -m signal_checker.check $ARGS

      - name: Save updated data
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "沒有需要儲存的變更"
          else
            git commit -m "signal check $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
